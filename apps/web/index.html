<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Konvertt</title>
    <meta name="description" content="Open-source, self-hosted file processing platform" />
    <meta name="theme-color" content="#E07832" />
    <link rel="icon" type="image/svg+xml" href="/konvertt-mark.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="Konvertt" />
    <meta property="og:description" content="Open-source, self-hosted file processing platform" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://konvertt.thegacs.in" />
    <meta property="og:image" content="https://konvertt.thegacs.in/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Drop any leftover service worker / Cache Storage from the previous
      // Konvertt SPA on this hostname so hard-refresh is not required.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            reg.unregister();
          });
        });
        // Install a one-shot kill-switch worker that unregisters itself after
        // replacing any still-controlling old worker for this origin.
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
